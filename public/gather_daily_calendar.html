
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,sans-serif)}
.cal-wrap{padding:8px 0 32px}
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.week-btn{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.week-btn.active{background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary)}
.week-grid{display:flex;flex-direction:column;gap:8px}
.day-row{border:0.5px solid var(--color-border-tertiary);border-radius:12px;overflow:hidden}
.day-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;background:var(--color-background-secondary)}
.day-header:hover{opacity:.85}
.day-label{font-size:13px;font-weight:500;color:var(--color-text-primary);min-width:110px}
.day-date{font-size:11px;color:var(--color-text-tertiary);min-width:60px}
.day-phase-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.day-hours{font-size:11px;color:var(--color-text-secondary);margin-left:auto;white-space:nowrap}
.day-chevron{font-size:10px;color:var(--color-text-tertiary);transition:transform .2s;margin-left:4px}
.day-chevron.open{transform:rotate(90deg)}
.day-body{padding:10px 14px 12px;display:none;border-top:0.5px solid var(--color-border-tertiary)}
.day-body.open{display:block}
.task-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-primary);line-height:1.5}
.task-row:last-child{border-bottom:none}
.task-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.task-main{flex:1}
.task-note{font-size:11px;color:var(--color-text-tertiary);margin-top:1px}
.hours-bar{display:flex;align-items:center;gap:8px;margin-top:8px}
.bar-track{flex:1;height:4px;background:var(--color-border-tertiary);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .3s}
.bar-label{font-size:11px;color:var(--color-text-secondary);white-space:nowrap}
.milestone-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 10px;border-radius:20px;background:var(--color-background-success);color:var(--color-text-success);margin-top:8px;font-weight:500}
.phase-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}
.leg-dot{width:8px;height:8px;border-radius:50%}
.total-bar{background:var(--color-background-secondary);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap}
.total-item{font-size:12px;color:var(--color-text-secondary)}
.total-item span{font-weight:500;color:var(--color-text-primary)}
</style>

let activeWeek = 0;

function renderWeekNav() {
  const nav = document.getElementById('week-nav');
  nav.innerHTML = weeks.map((w,i) =>
    `<button class="week-btn${i===activeWeek?' active':''}" onclick="switchWeek(${i})">${w.label}</button>`
  ).join('');
}

function renderWeek(wi) {
  const grid = document.getElementById('week-grid');
  const wDays = weeks[wi].days.map(i => days[i]);
  grid.innerHTML = wDays.map((d,li) => {
    const p = PHASES[d.phase];
    const di = weeks[wi].days[li];
    const totalPct = Math.round((d.hrs / 7) * 100);
    const milestone = d.milestone ? `<div class="milestone-tag">&#10003; ${d.milestone}</div>` : '';
    const tasks = d.tasks.map(t =>
      `<div class="task-row">
        <div class="task-dot" style="background:${p.color}"></div>
        <div class="task-main">${t.t}${t.note ? `<div class="task-note">${t.note}</div>` : ''}</div>
      </div>`
    ).join('');
    return `<div class="day-row" id="day-${di}">
      <div class="day-header" onclick="toggleDay(${di})">
        <span class="day-label">${d.date.split(' ').slice(0,2).join(' ')}</span>
        <span class="day-date">${d.date.split(' ').slice(2).join(' ')}</span>
        <span class="day-phase-badge" style="background:${p.bg};color:${p.text}">${p.label}</span>
        <span class="day-hours">${d.hrs} hrs</span>
        <span class="day-chevron" id="dchev-${di}">&#9654;</span>
      </div>
      <div class="day-body" id="dbody-${di}">
        ${tasks}
        <div class="hours-bar">
          <span class="bar-label" style="font-size:11px;color:var(--color-text-tertiary)">Est. hours</span>
          <div class="bar-track"><div class="bar-fill" style="width:${totalPct}%;background:${p.color}"></div></div>
          <span class="bar-label">${d.hrs} / 7</span>
        </div>
        ${milestone}
      </div>
    </div>`;
  }).join('');
}

function switchWeek(wi) {
  activeWeek = wi;
  renderWeekNav();
  renderWeek(wi);
}

function toggleDay(di) {
  const body = document.getElementById('dbody-'+di);
  const chev = document.getElementById('dchev-'+di);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  if(chev) chev.classList.toggle('open', !isOpen);
}

renderWeekNav();
renderWeek(0);
